<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found — Surya Dharma Putra</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#ffffff;--text:#0f172a;--muted:#475569;--acc:#2563eb;--ring:0 0 0 3px rgba(37,99,235,.25)}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:linear-gradient(90deg,#eef6ff,#f4efff);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      max-width:480px;
      width:100%;
      background:#ffffff;
      border:1px solid rgba(2,6,23,.06);
      border-radius:20px;
      box-shadow:0 24px 60px rgba(2,6,23,.10);
      padding:40px 32px;
      text-align:center;
    }
    .code{
      font-family:'Fraunces', Inter, serif;
      font-weight:800;
      font-size:64px;
      line-height:1;
      margin:0 0 8px;
      color:var(--acc);
    }
    h1{
      font-family:'Fraunces', Inter, serif;
      font-weight:700;
      font-size:22px;
      margin:0 0 10px;
    }
    p{
      color:var(--muted);
      line-height:1.6;
      margin:0 0 24px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:12px 20px;
      border-radius:12px;
      background:var(--acc);
      color:#ffffff;
      font-weight:600;
      text-decoration:none;
      transition:filter .15s ease, transform .15s ease;
    }
    .btn:hover{ filter:brightness(1.08); transform:translateY(-1px) }
    .btn:focus-visible{ outline:var(--ring) }
  </style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back to the portfolio.</p>
    <a class="btn" href="./index.html">Back to Home</a>
  </div>
</body>
</html>
